<main class="flex min-h-dvh items-center justify-center bg-canvas px-4 py-10">
  <div class="w-full max-w-md rounded-card border border-line-200 bg-surface p-8 text-center">
    <app-icon name="ShieldX" [size]="32" iconClass="mx-auto text-red-700" />
    <p class="mt-4 text-sm font-semibold tracking-widest text-ink-600">403</p>
    <h1 class="mt-1 text-2xl font-bold text-navy-900">Akses ditolak</h1>
    <p class="mt-2 text-sm text-ink-600">
      Akun Anda tidak memiliki akses ke halaman administrasi.
    </p>

    @if (user(); as current) {
      <p class="mt-4 text-xs text-ink-600">
        Masuk sebagai
        <span class="font-medium text-ink-900">{{ current.username }}</span>
        ({{ roleLabel() }})
      </p>
    }

    <button
      type="button"
      (click)="logout()"
      class="mt-6 inline-flex h-11 w-full items-center justify-center gap-2 rounded-control bg-navy-900 px-4 text-sm font-semibold text-white transition-colors hover:bg-navy-800"
    >
      <app-icon name="LogOut" [size]="16" />
      Keluar dan masuk dengan akun lain
    </button>
  </div>
</main>
