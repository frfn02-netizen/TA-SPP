@if (open()) {
  <button
    type="button"
    class="fixed inset-0 z-30 bg-navy-900/60 lg:hidden"
    aria-label="Tutup menu navigasi"
    (click)="close.emit()"
  ></button>
}

<aside
  id="admin-sidebar"
  class="fixed inset-y-0 left-0 z-40 flex w-60 flex-col bg-navy-900 transition-transform duration-150 ease-out lg:visible lg:translate-x-0"
  [class.-translate-x-full]="!open()"
  [class.translate-x-0]="open()"
  [class.invisible]="!open()"
  aria-label="Navigasi administrasi"
>
  <div class="flex h-16 items-center gap-3 border-b border-white/10 px-5">
    <div class="min-w-0">
      <p class="text-base font-bold leading-tight text-white">SPP QRIS</p>
      <p class="text-[11px] font-medium tracking-wide text-white/70">
        Administrasi Pembayaran
      </p>
    </div>
    <button
      type="button"
      class="ml-auto inline-flex h-9 w-9 items-center justify-center rounded-control text-white/80 hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white lg:hidden"
      (click)="close.emit()"
      aria-label="Tutup menu navigasi"
    >
      <app-icon name="X" [size]="20" />
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 py-5" aria-label="Menu utama">
    @for (group of navGroups; track group.label) {
      <div [class.mt-5]="$index > 0">
        <p class="px-3 text-[11px] font-semibold uppercase tracking-wider text-white/50">
          {{ group.label }}
        </p>
        <ul class="mt-2 space-y-1">
          @for (item of group.items; track item.link) {
            <li>
              <a
                [routerLink]="item.link"
                routerLinkActive="nav-link-active"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                (click)="close.emit()"
                class="nav-link relative flex min-h-11 items-center gap-3 rounded-control px-3 text-sm font-medium text-white/70 transition-colors hover:bg-white/5 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
              >
                <span class="nav-indicator absolute inset-y-1 left-0 w-0.5 rounded-full bg-transparent"></span>
                <app-icon [name]="item.icon" [size]="18" />
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</aside>
