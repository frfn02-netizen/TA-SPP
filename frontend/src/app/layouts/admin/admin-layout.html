<div class="min-h-dvh bg-canvas">
  <app-admin-sidebar [open]="menuOpen()" (close)="closeMenu()" />

  <div class="lg:pl-60">
    <app-admin-topbar
      [pageTitle]="pageTitle()"
      [username]="username()"
      [roleLabel]="roleLabel()"
      [menuOpen]="menuOpen()"
      (menuToggle)="toggleMenu()"
      (logout)="logout()"
    />

    <main class="mx-auto w-full max-w-[1200px] px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
      <router-outlet />
    </main>
  </div>
</div>
