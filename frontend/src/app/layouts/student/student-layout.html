<div class="min-h-dvh bg-canvas">
  <header class="sticky top-0 z-20 border-b border-line-200 bg-surface">
    <div class="mx-auto flex h-16 w-full max-w-[960px] items-center gap-4 px-4 sm:px-6">
      <a routerLink="/siswa" class="flex min-w-0 items-center gap-2.5">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-control bg-navy-900 text-white">
          <app-icon name="GraduationCap" [size]="18" />
        </span>
        <span class="min-w-0 leading-tight">
          <span class="block truncate text-sm font-bold text-navy-900">SPP QRIS</span>
          <span class="block truncate text-[11px] font-medium text-ink-600">
            Portal Siswa
          </span>
        </span>
      </a>

      <nav class="ml-4 hidden items-center gap-1 md:flex" aria-label="Navigasi siswa">
        @for (item of navItems; track item.link) {
          <a
            [routerLink]="item.link"
            routerLinkActive="student-nav-active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            ariaCurrentWhenActive="page"
            class="inline-flex h-10 items-center gap-2 rounded-control px-3 text-sm font-medium text-ink-700 transition-colors hover:bg-slate-50 hover:text-ink-900"
          >
            <app-icon [name]="item.icon" [size]="16" />
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="ml-auto flex items-center gap-3">
        <div class="hidden text-right sm:block">
          <p class="text-sm font-medium leading-tight text-ink-900">{{ username() }}</p>
          <p class="text-xs text-ink-600">Siswa</p>
        </div>
        <button
          type="button"
          (click)="logout()"
          aria-label="Keluar dari akun"
          class="inline-flex h-10 items-center gap-2 rounded-control border border-line-300 bg-surface px-3 text-sm font-medium text-ink-700 transition-colors hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-navy-900"
        >
          <app-icon name="LogOut" [size]="16" />
          <span class="hidden sm:inline">Keluar</span>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-[960px] px-4 py-6 pb-28 sm:px-6 md:pb-10">
    <router-outlet />
  </main>

  <nav
    class="fixed inset-x-0 bottom-0 z-20 border-t border-line-200 bg-surface pb-[env(safe-area-inset-bottom)] md:hidden"
    aria-label="Navigasi siswa"
  >
    <ul class="grid grid-cols-3">
      @for (item of navItems; track item.link) {
        <li>
          <a
            [routerLink]="item.link"
            routerLinkActive="student-tab-active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            ariaCurrentWhenActive="page"
            class="flex h-16 flex-col items-center justify-center gap-1 text-[11px] font-medium text-ink-600"
          >
            <app-icon [name]="item.icon" [size]="20" />
            {{ item.shortLabel }}
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
